[project]
name = "forecast-bench"
version = "0.1.0"
description = "Forecasting benchmark framework for local and cloud execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "mlflow>=2.9.0",
    "boto3>=1.28.0",
    "s3fs>=2023.6.0",
    # Forecasting models - baselines
    "statsmodels>=0.14.0",
    # Plotting
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
]
ml = [
    "prophet>=1.1.4",
    "lightgbm>=4.0.0",
    "torch>=2.0.0",
]
foundation = [
    "transformers>=4.35.0",
    "chronos-forecasting>=1.0.0",
]

[project.scripts]
bench = "bench.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "PL"]
ignore = ["E501", "PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
